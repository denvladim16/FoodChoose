<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Промо Меню</title>
<meta name="description" content="Седмично меню по актуалните промоции и брошури на Lidl, Kaufland и Billa">
<meta name="theme-color" content="#f6f5ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121510" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥕</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f5ef; --card:#ffffff; --ink:#1e271b; --muted:#6c7567; --line:#e5e7dd;
  --accent:#7cbf3a; --accent-2:#5fa42a; --accent-ink:#2c5512; --accent-soft:#ebf5df;
  --promo:#d9381e; --promo-soft:#fdeae6; --info:#2f6fd0; --info-soft:#e6effc;
  --shadow:0 1px 2px rgba(30,40,20,.06),0 6px 18px rgba(30,40,20,.06);
  --radius:18px;
  --t1:#e7dcff; --t2:#cfeaff; --t3:#ffe7c7; --t4:#d6f2d0; --t5:#ffd7cc; --t6:#c9f1ee; --t7:#ffd3e2; --t8:#dcdcf7;
  --s-lidl:#1f5fbf; --s-kaufland:#d42a2a; --s-billa:#e8b500;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121510; --card:#1b2017; --ink:#eef2e8; --muted:#9ba592; --line:#2b3226;
    --accent:#8fd14f; --accent-2:#7cbf3a; --accent-ink:#d9f2c0; --accent-soft:#24331a;
    --promo:#ff7a5c; --promo-soft:#3a1f19; --info:#7fb0ff; --info-soft:#1c2a40;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
    --t1:#3a3152; --t2:#223a4d; --t3:#4a3a22; --t4:#24402a; --t5:#4a2c25; --t6:#1f4240; --t7:#4a2535; --t8:#2c2c4a;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121510; --card:#1b2017; --ink:#eef2e8; --muted:#9ba592; --line:#2b3226;
  --accent:#8fd14f; --accent-2:#7cbf3a; --accent-ink:#d9f2c0; --accent-soft:#24331a;
  --promo:#ff7a5c; --promo-soft:#3a1f19; --info:#7fb0ff; --info-soft:#1c2a40;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  --t1:#3a3152; --t2:#223a4d; --t3:#4a3a22; --t4:#24402a; --t5:#4a2c25; --t6:#1f4240; --t7:#4a2535; --t8:#2c2c4a;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.4}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input,select{font:inherit;color:inherit}
a{color:var(--info)}
.app{max-width:480px;margin:0 auto;min-height:100dvh;position:relative;padding-bottom:calc(88px + env(safe-area-inset-bottom))}
.hidden{display:none!important}
.muted{color:var(--muted)}
.small{font-size:13px}
.tiny{font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:800;color:var(--muted)}
h1{font-size:28px;line-height:1.15;margin:0 0 6px;font-weight:900;letter-spacing:-.01em}
h2{font-size:20px;margin:0 0 10px;font-weight:900}
h3{font-size:17px;margin:0;font-weight:800}

/* ---------- onboarding ---------- */
.ob{min-height:100dvh;display:flex;flex-direction:column;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
.ob-top{display:flex;align-items:center;gap:14px;height:44px}
.icon-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:20px}
.icon-btn:hover{background:var(--line)}
.bar{flex:1;height:6px;border-radius:9px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:9px;transition:width .35s ease}
.ob-head{margin:26px 4px 22px}
.ob-body{flex:1}
.cta{display:block;width:100%;padding:16px;border-radius:999px;background:var(--accent);color:#fff;font-weight:900;font-size:17px;box-shadow:0 6px 16px color-mix(in srgb,var(--accent) 40%,transparent);transition:transform .1s,opacity .2s}
.cta:active{transform:scale(.98)}
.cta:disabled{opacity:.4;box-shadow:none;cursor:not-allowed}
.cta.ghost{background:var(--card);color:var(--ink);border:2px solid var(--line);box-shadow:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{position:relative;border-radius:var(--radius);padding:16px 10px;min-height:86px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-weight:800;text-align:center;border:3px solid transparent;transition:transform .12s,border-color .15s}
.tile .em{font-size:26px;line-height:1}
.tile:active{transform:scale(.97)}
.tile.on{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.tile.on::after{content:"✓";position:absolute;top:8px;right:10px;width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;font-size:13px;display:grid;place-items:center}
.tile.none{grid-column:1/-1;background:var(--line);min-height:62px}
.store-tiles{display:grid;gap:14px}
.store-tile{display:flex;align-items:center;gap:16px;padding:18px;border-radius:var(--radius);background:var(--card);box-shadow:var(--shadow);border:3px solid transparent;text-align:left}
.store-tile.on{border-color:var(--accent)}
.store-mark{width:56px;height:56px;border-radius:14px;display:grid;place-items:center;font-weight:900;color:#fff;font-size:20px;flex:none}
.store-tile b{font-size:20px;display:block}
.budget-amt{text-align:center;font-size:64px;font-weight:900;letter-spacing:-.02em;margin:30px 0 0}
input[type=range]{width:100%;accent-color:var(--accent);height:36px}
.range-lbl{display:flex;justify-content:space-between;color:var(--muted);font-size:13px}
.stepper{display:flex;align-items:center;justify-content:space-between;background:var(--card);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);margin-bottom:14px}
.stepper .ctl{display:flex;align-items:center;gap:14px}
.stepper .ctl button{width:40px;height:40px;border-radius:50%;background:var(--accent-soft);color:var(--accent-ink);font-size:22px;font-weight:900}
.stepper .ctl span{min-width:26px;text-align:center;font-weight:900;font-size:22px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 14px;border-radius:999px;background:var(--card);border:2px solid var(--line);font-weight:800;font-size:14px}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}
.appl{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.appl .tile{background:var(--card);box-shadow:var(--shadow);min-height:120px}
.appl svg{width:44px;height:44px;stroke:var(--ink);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.appl .tile.on svg{stroke:var(--accent-2)}

.building{min-height:100dvh;display:flex;flex-direction:column;padding:60px 20px 40px}
.cart-stage{flex:1;position:relative;display:grid;place-items:center;overflow:hidden}
.cart{font-size:84px;filter:drop-shadow(0 8px 10px rgba(0,0,0,.12))}
.drop{position:absolute;top:-40px;font-size:34px;animation:fall 1.1s ease-in forwards}
@keyframes fall{to{transform:translateY(calc(50dvh - 60px)) rotate(180deg);opacity:.0}}
.checklist{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px;display:grid;gap:12px}
.checklist div{display:flex;gap:12px;align-items:center;font-weight:700}
.checklist i{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-style:normal;font-size:13px;color:#fff;transition:all .25s}
.checklist .done i{background:var(--accent);border-color:var(--accent)}

/* ---------- main ---------- */
.screen{padding:18px 16px 10px}
.hello{text-align:center;margin:8px 0 14px}
.hello .tiny{margin-bottom:4px}
.hello h1{font-size:30px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--accent-soft);color:var(--accent-ink);font-weight:800;font-size:13px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.summary{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0 10px}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 16px}
.cost b{font-size:24px;font-weight:900;white-space:nowrap}
.cost .of{color:var(--muted);font-weight:700;white-space:nowrap;font-size:14px}
.meter{height:6px;background:var(--line);border-radius:9px;margin-top:8px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:9px}
.meter.over i{background:var(--promo)}
.glist{background:var(--info-soft);text-align:left}
.glist b{display:block;font-size:18px;color:var(--ink)}
.compare{display:flex;gap:8px;overflow-x:auto;padding:4px 0 6px;scrollbar-width:none}
.compare::-webkit-scrollbar{display:none}
.cmp{flex:none;display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:12px;background:var(--card);border:2px solid var(--line);font-size:13px;font-weight:800}
.cmp.on{border-color:var(--accent)}
.cmp.best::after{content:"най-евтино";font-size:10px;font-weight:900;color:var(--accent-ink);background:var(--accent-soft);padding:2px 6px;border-radius:6px}
.note{font-size:12px;color:var(--muted);margin:2px 2px 12px}
.banner{border-radius:14px;padding:12px 14px;font-size:14px;margin:0 0 14px;background:var(--promo-soft)}
.banner.info{background:var(--info-soft)}
.day{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:var(--card);border:2px solid color-mix(in srgb,var(--accent) 55%,transparent);border-radius:var(--radius);padding:12px;margin-bottom:12px;box-shadow:var(--shadow);transition:transform .1s}
.day:active{transform:scale(.99)}
.thumb{width:74px;height:74px;border-radius:50%;display:grid;place-items:center;font-size:38px;flex:none;position:relative}
.day .info{flex:1;min-width:0}
.day .tiny{font-size:10px}
.day h3{margin:2px 0 4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tag{display:inline-block;font-size:11px;font-weight:900;padding:2px 8px;border-radius:999px;margin-right:4px}
.meta{font-size:13px;color:var(--muted);margin-top:4px;display:flex;gap:10px;flex-wrap:wrap}
.promo-badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:900;color:var(--promo);background:var(--promo-soft);padding:2px 8px;border-radius:999px}
.br-badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:900;color:var(--info);background:var(--info-soft);padding:2px 8px;border-radius:999px}
.rebuild{margin:8px 0 6px}

.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:8px 4px calc(8px + env(safe-area-inset-bottom));z-index:20}
.nav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:800;color:var(--muted);padding:4px 0}
.nav button .ni{font-size:22px;filter:grayscale(1);opacity:.6}
.nav button.on{color:var(--accent-2)}
.nav button.on .ni{filter:none;opacity:1}

/* ---------- sheets ---------- */
.sheet{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;max-width:480px;margin:0 auto;animation:up .25s ease}
@keyframes up{from{transform:translateY(24px);opacity:0}}
.hero{height:230px;display:grid;place-items:center;font-size:110px;position:relative}
.hero h1{position:absolute;left:16px;right:16px;bottom:12px;font-size:26px;color:var(--ink)}
.hero .icon-btn{position:absolute;top:calc(12px + env(safe-area-inset-top));background:var(--card);box-shadow:var(--shadow)}
.hero .back{left:12px}.hero .fav{right:12px}
.sheet-body{padding:16px 16px 110px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px 6px;text-align:center;padding:14px 8px;border:2px solid color-mix(in srgb,var(--accent) 55%,transparent)}
.stats b{display:block;font-size:20px;font-weight:900}
.stats span{font-size:10px;letter-spacing:.06em;color:var(--muted);font-weight:800;text-transform:uppercase}
.section-title{text-align:center;margin:22px 0 10px;font-size:20px;font-weight:900}
.ing-list{padding:4px 14px;border:2px solid color-mix(in srgb,var(--accent) 55%,transparent)}
.ing{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.ing:last-child{border-bottom:0}
.ing .e{font-size:22px;width:28px;text-align:center}
.ing .nm{flex:1;font-weight:700}
.ing .nm small{display:block;font-weight:600;color:var(--muted);font-size:12px}
.ing .q{font-weight:800;text-align:right;font-size:14px}
.ing .q small{display:block;color:var(--muted);font-weight:700;font-size:12px}
.steps{padding:14px 16px;border:2px solid color-mix(in srgb,var(--accent) 55%,transparent)}
.steps ol{margin:0;padding-left:22px}
.steps li{margin:0 0 12px;padding-left:4px}
.steps li::marker{font-weight:900}
.sticky-cta{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;padding:12px 16px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 30%);z-index:41}
.sheet-top{position:sticky;top:0;z-index:2;background:var(--bg);display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;border-bottom:1px solid var(--line)}
.sheet-top h2{margin:0;flex:1;font-size:19px}
.gsec{margin:16px 0 6px;font-weight:900;display:flex;gap:8px;align-items:center}
.gitem{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--card);border-radius:14px;margin-bottom:8px;box-shadow:var(--shadow);width:100%;text-align:left}
.gitem .box{width:24px;height:24px;border-radius:8px;border:2px solid var(--line);flex:none;display:grid;place-items:center;color:#fff;font-weight:900;font-size:14px}
.gitem.done{opacity:.55}
.gitem.done .box{background:var(--accent);border-color:var(--accent)}
.gitem.done .nm{text-decoration:line-through}
.gitem .nm{flex:1;font-weight:800}
.gitem .nm small{display:block;color:var(--muted);font-weight:600;font-size:12px}

/* ---------- brochures ---------- */
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--line);border-radius:14px;padding:4px;gap:4px;margin-bottom:14px}
.seg button{padding:10px 4px;border-radius:10px;font-weight:900;font-size:14px;display:flex;gap:6px;align-items:center;justify-content:center}
.seg button.on{background:var(--card);box-shadow:var(--shadow)}
.search{display:flex;gap:8px;align-items:center;background:var(--card);border-radius:14px;padding:4px 6px 4px 14px;box-shadow:var(--shadow);margin-bottom:14px}
.search input{flex:1;border:0;background:transparent;padding:10px 0;outline:none;min-width:0}
.flyers{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.flyer{background:var(--card);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;text-align:left;display:flex;flex-direction:column}
.flyer .cv{aspect-ratio:7/10;background:var(--line) center/cover no-repeat;position:relative}
.flyer .cv .now{position:absolute;top:8px;left:8px;background:var(--accent);color:#fff;font-size:11px;font-weight:900;padding:3px 8px;border-radius:999px}
.flyer .cv .soon{background:var(--info)}
.flyer .fi{padding:10px 12px}
.flyer .fi b{display:block;font-size:14px}
.hits{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.hit{border-radius:12px;overflow:hidden;background:var(--card);box-shadow:var(--shadow);text-align:left}
.hit img{width:100%;aspect-ratio:7/10;object-fit:cover;display:block;background:var(--line)}
.hit span{display:block;font-size:11px;font-weight:800;padding:5px 7px}
.viewer{position:fixed;inset:0;z-index:50;background:#0d0f0c;display:flex;flex-direction:column;max-width:none}
.viewer .vt{display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top)) 10px 8px;color:#fff}
.viewer .vt .icon-btn:hover{background:#ffffff22}
.viewer .vt b{flex:1;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.viewer .vt a{color:#fff;font-weight:800;font-size:13px;padding:6px 10px;border:1px solid #ffffff44;border-radius:999px;text-decoration:none;white-space:nowrap}
.pages{flex:1;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.pages::-webkit-scrollbar{display:none}
.pages figure{flex:none;width:100%;height:100%;margin:0;scroll-snap-align:center;display:grid;place-items:center;padding:6px}
.pages img{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px;background:#222}
.viewer .vb{color:#ddd;text-align:center;padding:8px 10px calc(12px + env(safe-area-inset-bottom));font-size:13px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:10px}
.viewer .vb button{color:#fff;font-size:26px;width:44px;height:44px;border-radius:50%;background:#ffffff18}
.viewer iframe{flex:1;border:0;width:100%;background:#fff}

/* ---------- offers ---------- */
.offer{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--card);border-radius:14px;margin-bottom:8px;box-shadow:var(--shadow)}
.offer .nm{flex:1;font-weight:800;font-size:14px}
.offer .nm small{display:block;color:var(--muted);font-weight:600;font-size:12px}
.offer .pr{text-align:right;font-weight:900}
.offer .pr s{display:block;color:var(--muted);font-weight:700;font-size:12px}
.pct{font-size:12px;font-weight:900;color:#fff;background:var(--promo);padding:4px 7px;border-radius:8px;flex:none}

/* ---------- settings ---------- */
.set-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.set-row:last-child{border-bottom:0}
.set-row input[type=text]{border:2px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 10px;width:150px}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty .big{font-size:46px;display:block;margin-bottom:8px}
.rlist .day{border-color:var(--line)}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:800;font-size:14px;z-index:60;animation:up .2s}
/* ---------- дни × хранения ---------- */
.slots{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:10px}
.sl-row{display:grid;grid-template-columns:1.3fr repeat(3,1fr);gap:6px;align-items:center;margin-bottom:6px}
.sl-row:last-child{margin-bottom:0}
.sl-col{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:900;padding:6px 0;border-radius:10px}
.sl-col .em{font-size:20px}
.sl-col:hover{background:var(--line)}
.sl-day{text-align:left;font-weight:800;font-size:14px;padding:10px 8px;border-radius:10px;color:var(--muted)}
.sl-day.on{color:var(--ink)}
.sl-cell{height:44px;border-radius:12px;border:2px solid var(--line);background:var(--bg);font-weight:900;color:#fff;font-size:18px;transition:all .12s}
.sl-cell.on{background:var(--accent);border-color:var(--accent)}
.day-head{font-weight:900;font-size:15px;margin:18px 4px 8px;display:flex;align-items:center;gap:8px}
.day-head::after{content:"";flex:1;height:1px;background:var(--line)}
.ideas{margin-top:14px}
.ideas .chip{text-decoration:none;color:var(--ink)}
.gtotal{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:8px}
.gtotal b{font-size:26px;font-weight:900}
.gitem{align-items:flex-start}
.gitem .box{cursor:pointer;margin-top:2px}
.gitem .nm small+small{margin-top:2px}
.gright{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none}
.gright b{font-weight:900}
.have-btn{font-size:12px;font-weight:800;padding:5px 10px;border-radius:999px;border:2px solid var(--line);background:var(--bg);color:var(--muted);white-space:nowrap}
.have-btn.on{border-color:var(--accent);color:var(--accent-ink);background:var(--accent-soft)}
.gitem.done .have-btn{opacity:1}
.have-badge{display:inline-flex;font-size:11px;font-weight:900;color:var(--accent-ink);background:var(--accent-soft);padding:2px 8px;border-radius:999px}
/* ---------- бутон „смени“ и избор на ястие ---------- */
.day-wrap{position:relative}
.day.has-swap{padding-right:64px}
.swap-btn{position:absolute;right:10px;top:50%;transform:translateY(-50%);margin-top:-6px;width:48px;height:54px;border-radius:14px;background:var(--accent-soft);color:var(--accent-ink);font-size:20px;font-weight:900;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.swap-btn span{font-size:10px;margin-top:3px;letter-spacing:.02em}
.swap-btn:active{transform:translateY(-50%) scale(.94)}
.thumb.sm{width:46px;height:46px;font-size:24px}
.cur-pick{display:flex;align-items:center;gap:12px}
.pick-row{display:flex;gap:8px;margin-bottom:8px}
.pick{flex:1;display:flex;align-items:center;gap:12px;background:var(--card);border-radius:14px;padding:10px 12px;box-shadow:var(--shadow);text-align:left;min-width:0}
.pick .nm{flex:1;font-weight:800;min-width:0}
.pick .nm small{display:block;color:var(--muted);font-weight:600;font-size:12px;margin:2px 0 3px}
.delta{font-weight:900;font-size:13px;white-space:nowrap;color:var(--muted)}
.delta.up{color:var(--promo)}
.delta.down{color:var(--accent-2)}
.peek{width:46px;flex:none;border-radius:14px;background:var(--card);box-shadow:var(--shadow);font-size:18px}
@media (min-width:520px){ .sheet{box-shadow:0 0 0 1px var(--line)} }
</style>
</head>
<body>
<div class="app" id="app"></div>
<script src="js/recipes.js"></script>
<script src="js/recipes-more.js"></script>
<script src="js/app.js"></script>
</body>
