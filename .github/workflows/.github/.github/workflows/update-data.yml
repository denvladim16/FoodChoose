name: Обнови данните и публикувай

on:
  schedule:
    # всеки ден в 04:17 UTC (07:17 българско време); kolkostruva публикува данните за вчера около полунощ
    - cron: '17 4 * * *'
    # и в четвъртък следобед, когато излизат новите брошури на Billa
    - cron: '17 13 * * 4'
  push:
    branches: [main]      # при всяка твоя промяна сайтът се публикува наново
  workflow_dispatch: {}   # бутон „Run workflow“ за ръчно пускане

permissions:
  contents: write   # за да запише обновените data/*.json
  pages: write      # за публикуване в GitHub Pages
  id-token: write

concurrency:
  group: promo-menu
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # При push от теб не теглим наново (за да е бързо); при график/ръчно — теглим.
      - name: Изтегли брошури и цени
        if: github.event_name != 'push'
        continue-on-error: true   # ако някой сайт не отговаря, пак публикуваме последните данни
        run: node scripts/update-data.mjs

      - name: Запиши новите данни в repo-то
        if: github.event_name != 'push'
        run: |
          git config user.name  "promo-menu-bot"
          git config user.email "promo-menu-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Няма промени в данните."
          else
            git commit -m "Обновени брошури и цени $(date -u +%Y-%m-%d)"
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deploy
        uses: actions/deploy-pages@v4
